<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{% block title %}Ella CV{% endblock %}</title>
    <style>
      /* Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8f9fa;
      }

      /* Dark Mode Support */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1a1a1a !important;
        }
        .email-wrapper {
          background-color: #1a1a1a !important;
        }
        .email-container {
          background-color: #2d2d2d !important;
          border: 1px solid #3d3d3d !important;
        }
        .email-header {
          background-color: #2d2d2d !important;
          border-bottom: 1px solid #3d3d3d !important;
        }
        .header-title {
          color: #e5e5e5 !important;
        }
        .header-subtitle {
          color: #a0a0a0 !important;
        }
        .email-body {
          color: #e5e5e5 !important;
        }
        .greeting,
        .content-text {
          color: #e5e5e5 !important;
        }
        .email-footer {
          background-color: #242424 !important;
          border-top: 1px solid #3d3d3d !important;
        }
        .footer-text {
          color: #a0a0a0 !important;
        }
      }

      /* Main Container - Mobile First */
      .email-wrapper {
        width: 100% !important;
        background-color: #f8f9fa;
        padding: 0;
        margin: 0;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 0;
      }

      /* Header - Clean & Minimal */
      .email-header {
        background: #ffffff;
        color: #111827;
        padding: 32px 24px 24px;
        text-align: center;
        border-bottom: 1px solid #e5e7eb;
      }

      .email-header img {
        height: 40px;
        width: auto;
        margin: 0 auto 24px;
        display: block;
      }

      .logo-subtitle {
        display: none;
      }

      .header-title {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.3;
        color: #111827;
      }

      .header-subtitle {
        margin: 0;
        font-size: 15px;
        color: #6b7280;
        font-weight: 400;
      }

      /* Body Content - Clean & Spacious */
      .email-body {
        padding: 32px 24px;
        color: #1f2937;
      }

      .greeting {
        font-size: 17px;
        font-weight: 600;
        color: #111827;
        margin: 0 0 16px;
      }

      .content-text {
        font-size: 15px;
        color: #374151;
        margin: 0 0 16px;
        line-height: 1.6;
      }

      /* CTA Button - Simple & Effective */
      .button-container {
        text-align: center;
        margin: 32px 0;
      }

      .cta-button {
        display: inline-block;
        padding: 14px 32px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
      }

      .cta-button:hover {
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      }

      /* Info Box - Clean Card Style */
      .info-box {
        background: #f9fafb;
        border-left: 3px solid #6366f1;
        padding: 20px;
        margin: 24px 0;
        border-radius: 6px;
      }

      .info-box-title {
        font-size: 15px;
        font-weight: 600;
        color: #111827;
        margin: 0 0 12px;
      }

      .info-box-text {
        font-size: 14px;
        color: #4b5563;
        margin: 6px 0;
        line-height: 1.6;
      }

      /* Warning Box - Subtle Alert */
      .warning-box {
        background: #fef3c7;
        border-left: 3px solid #f59e0b;
        border-radius: 6px;
        padding: 16px 20px;
        margin: 20px 0;
      }

      .warning-text {
        font-size: 14px;
        color: #92400e;
        margin: 0;
        line-height: 1.5;
      }

      /* Footer - Minimal & Professional */
      .email-footer {
        background: #f9fafb;
        padding: 32px 24px;
        text-align: center;
        border-top: 1px solid #e5e7eb;
      }

      .footer-text {
        font-size: 13px;
        color: #6b7280;
        margin: 6px 0;
        line-height: 1.5;
      }

      .footer-link {
        color: #6366f1;
        text-decoration: none;
      }

      .footer-link:hover {
        text-decoration: underline;
      }

      /* Social Links - Simple */
      .social-links {
        margin: 16px 0;
      }

      .social-link {
        display: inline-block;
        margin: 0 12px;
        color: #6b7280;
        text-decoration: none;
        font-size: 13px;
      }

      .social-link:hover {
        color: #6366f1;
      }

      /* Divider */
      .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 20px 0;
      }

      /* Mobile Responsive - Optimized for All Devices */
      @media only screen and (max-width: 600px) {
        .email-container {
          border-radius: 0 !important;
        }

        .email-header {
          padding: 40px 20px !important;
        }

        .header-title {
          font-size: 22px !important;
        }

        .header-subtitle {
          font-size: 14px !important;
        }

        .email-body {
          padding: 24px 20px !important;
        }

        .greeting {
          font-size: 16px !important;
        }

        .content-text {
          font-size: 14px !important;
        }

        .cta-button {
          padding: 12px 28px !important;
          font-size: 14px !important;
          display: block !important;
          width: 100% !important;
          max-width: 280px !important;
          margin: 24px auto !important;
        }

        .info-box,
        .warning-box {
          padding: 16px !important;
          margin: 20px 0 !important;
        }

        .email-footer {
          padding: 24px 20px !important;
        }

        .social-link {
          margin: 0 8px !important;
          font-size: 12px !important;
        }
      }

      /* Extra Small Devices */
      @media only screen and (max-width: 400px) {
        .logo {
          font-size: 24px !important;
        }

        .header-title {
          font-size: 20px !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="email-container">
        <!-- Header -->
        <div class="email-header">
          <!-- Logo -->
          <img
            src="https://ellacv.com/images/seo-images/logo-400by92.png"
            alt="Ella CV"
          />
          {% block header %}
          <h1 class="header-title">Email Title</h1>
          <p class="header-subtitle">Email subtitle</p>
          {% endblock %}
        </div>
        <!-- Body Content -->
        <div class="email-body">
          {% block content %}
          <!-- Email content goes here -->
          {% endblock %}
        </div>

        <!-- Footer -->
        <div class="email-footer">
          <p
            class="footer-text"
            style="font-weight: 600; color: #111827; margin-bottom: 4px"
          >
            ella
          </p>
          <p class="footer-text" style="margin-bottom: 16px">
            Professional CV Writing & Analysis
          </p>

          <div class="social-links">
            <a href="https://ellacv.com" class="social-link">Home</a>
            <span style="color: #d1d5db">•</span>
            <a href="https://ellacv.com/help" class="social-link">Help</a>
            <span style="color: #d1d5db">•</span>
            <a href="https://ellacv.com/privacy" class="social-link">Privacy</a>
          </div>

          <div class="divider"></div>

          <p class="footer-text" style="font-size: 12px; color: #9ca3af">
            © {% now "Y" %} Ella CV. All rights reserved.
          </p>

          {% block footer_extra %} {% endblock %}
        </div>
      </div>
    </div>
  </body>
</html>
