name: Weekly Deep Job Scraper

on:
  # Schedule: Run every Sunday at 3:00 AM UTC
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 3:00 AM UTC

  # Allow manual trigger
  workflow_dispatch:

jobs:
  deep-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Longer timeout for deep scrape

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Deep Job Scraping (7 days)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DJANGO_SETTINGS_MODULE: ella_backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: |
          echo "🚀 Starting WEEKLY DEEP scrape (7 days)..."
          python manage.py run_all_scrapers --days 7 --force
          echo "✅ Deep scraping completed!"

      - name: 📊 Weekly Statistics Report
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📊 Generating weekly report..."
          python manage.py shell << EOF
          from jobstract.models import Opportunity, Employer
          from django.utils import timezone
          from datetime import timedelta

          # Weekly stats
          week_ago = timezone.now() - timedelta(days=7)
          weekly_jobs = Opportunity.objects.filter(created_at__gte=week_ago).count()

          # Total stats
          total_jobs = Opportunity.objects.count()
          total_employers = Employer.objects.count()

          # Jobs by type
          job_types = Opportunity.objects.filter(created_at__gte=week_ago).values('opportunity_type').annotate(count=Count('id'))

          # Top employers this week
          from django.db.models import Count
          top_employers = Opportunity.objects.filter(created_at__gte=week_ago).values('employer__employer_name').annotate(count=Count('id')).order_by('-count')[:10]

          print("=" * 50)
          print("📈 WEEKLY SCRAPING REPORT")
          print("=" * 50)
          print(f"Jobs added this week: {weekly_jobs}")
          print(f"Total jobs in database: {total_jobs}")
          print(f"Total employers: {total_employers}")
          print(f"Average jobs/day: {weekly_jobs / 7:.1f}")
          print("\n📊 Jobs by Type (This Week):")
          for jt in job_types:
              print(f"  - {jt['opportunity_type']}: {jt['count']}")
          print("\n🏆 Top 10 Employers (This Week):")
          for idx, emp in enumerate(top_employers, 1):
              print(f"  {idx}. {emp['employer__employer_name']}: {emp['count']} jobs")
          print("=" * 50)
          EOF

      - name: 📧 Notify on failure
        if: failure() && secrets.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFICATION_EMAIL }}
          password: ${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}
          subject: "🚨 Weekly Deep Scraper Failed - ${{ github.run_id }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <noreply@github.com>
          body: |
            Weekly deep scraper workflow failed!

            Repository: ${{ github.repository }}
            Run ID: ${{ github.run_id }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the logs for details.
