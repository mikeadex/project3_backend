name: Daily Job Scraper

on:
  # Schedule: Run daily at 2:00 AM UTC
  schedule:
    - cron: "0 2 * * *" # Daily at 2:00 AM UTC

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      location:
        description: "Location to search (leave empty for UK-wide)"
        required: false
        default: ""
      days:
        description: "Number of days to scrape"
        required: false
        default: "1"
      force:
        description: "Force run (ignore cooldown)"
        required: false
        type: boolean
        default: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevent hanging jobs

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip" # Cache pip dependencies for faster runs

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Job Scrapers
        env:
          # Database credentials (from GitHub Secrets)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # API Keys (from GitHub Secrets)
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # Django settings
          DJANGO_SETTINGS_MODULE: ella_backend.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: |
          echo "🚀 Starting job scrapers..."

          # Use inputs if manual trigger, otherwise use defaults
          LOCATION="${{ github.event.inputs.location || '' }}"
          DAYS="${{ github.event.inputs.days || '1' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          # Build command arguments
          CMD="python manage.py run_all_scrapers --days $DAYS"

          if [ "$FORCE" = "true" ]; then
            CMD="$CMD --force"
          fi

          if [ -n "$LOCATION" ]; then
            CMD="$CMD --location '$LOCATION'"
          fi

          echo "📝 Running command: $CMD"
          eval $CMD

          echo "✅ Job scraping completed successfully!"

      - name: 📊 Summary Statistics
        if: always() # Run even if scraping partially failed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📊 Generating statistics..."
          python manage.py shell << EOF
          from jobstract.models import Opportunity
          from django.utils import timezone
          from datetime import timedelta

          # Jobs added today
          today = timezone.now().date()
          today_jobs = Opportunity.objects.filter(created_at__date=today).count()

          # Total jobs
          total_jobs = Opportunity.objects.count()

          # Jobs from last 7 days
          week_ago = timezone.now() - timedelta(days=7)
          weekly_jobs = Opportunity.objects.filter(created_at__gte=week_ago).count()

          print(f"📈 Statistics:")
          print(f"  - Jobs added today: {today_jobs}")
          print(f"  - Total jobs in DB: {total_jobs}")
          print(f"  - Jobs from last 7 days: {weekly_jobs}")
          print(f"  - Average per day (last 7d): {weekly_jobs / 7:.1f}")
          EOF

      - name: 📧 Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFICATION_EMAIL }}
          password: ${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}
          subject: "🚨 Job Scraper Failed - ${{ github.run_id }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            Job scraper workflow failed!

            Repository: ${{ github.repository }}
            Run ID: ${{ github.run_id }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the logs for details.
