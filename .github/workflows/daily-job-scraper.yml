name: Daily Job Scraper

on:
  # Schedule: Run daily at 2:00 AM UTC
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      location:
        description: "Location to search (leave empty for UK-wide)"
        required: false
        default: ""
      days:
        description: "Number of days to scrape"
        required: false
        default: "1"
      force:
        description: "Force run (ignore cooldown)"
        required: false
        type: boolean
        default: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Verify Environment Variables
        run: |
          echo "Checking environment variables..."
          if [ -z "\$DATABASE_URL" ]; then
            echo "❌ ERROR: DATABASE_URL is not set!"
            exit 1
          else
            echo "✅ DATABASE_URL is set"
          fi

          if [ -z "\$REED_API_KEY" ]; then
            echo "⚠️ WARNING: REED_API_KEY is not set"
          else
            echo "✅ REED_API_KEY is set"
          fi

          if [ -z "\$ADZUNA_APP_ID" ]; then
            echo "⚠️ WARNING: ADZUNA_APP_ID is not set"
          else
            echo "✅ ADZUNA_APP_ID is set"
          fi

          if [ -z "\$ADZUNA_APP_KEY" ]; then
            echo "⚠️ WARNING: ADZUNA_APP_KEY is not set"
          else
            echo "✅ ADZUNA_APP_KEY is set"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: 🔍 Run Job Scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DJANGO_SETTINGS_MODULE: ella_writer.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: |
          echo "🚀 Starting job scrapers..."
          set -e  # Exit on error
          python manage.py run_all_scrapers --days 1 --debug 2>&1 | tee scraper_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "📝 Scraper exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Job scraping failed with exit code $EXIT_CODE"
            cat scraper_output.log
            exit $EXIT_CODE
          fi
          echo "✅ Job scraping completed successfully!"

      - name: � Upload Scraper Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scraper-logs
          path: scraper_output.log
          retention-days: 7

      - name: �📊 Summary Statistics
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: ella_writer.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python -c "import django; django.setup(); from jobstract.models import Opportunity; from django.utils import timezone; today = timezone.now().date(); today_jobs = Opportunity.objects.filter(created_at__date=today).count(); total_jobs = Opportunity.objects.count(); print(f'📊 Jobs added today: {today_jobs}'); print(f'📊 Total jobs: {total_jobs}')"
