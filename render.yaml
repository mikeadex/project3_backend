services:
  - type: web
    name: ella-backend
    env: python
    plan: free
    branch: main
    buildCommand: |
      python -m pip install --upgrade pip
      # Install all requirements except textract
      grep -v "textract" requirements.txt > requirements_filtered.txt
      pip install -r requirements_filtered.txt
      # Install textract dependencies individually to avoid version specification issues
      pip install beautifulsoup4>=4.8.0 chardet>=3.0.4 docx2txt>=0.8 extract-msg==0.28.0 pdfminer.six>=20181108 python-pptx>=0.6.5 six>=1.12.0 SpeechRecognition>=3.8.1
      # Install textract with a specific version
      pip install textract==1.6.4
      # Run Django commands
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: "./bin/start_gunicorn.sh"
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ella_writer.settings
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: www.ellacvwriter.com,ellacvwriter.com,ella-backend-gw8c.onrender.com,www.ellacv.com,ellacv.com,ellacvwriter.vercel.app,www.ellacvwriter.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.ellacvwriter.com,https://ellacvwriter.com,https://www.ellacv.com,https://ellacv.com,https://ellacvwriter.vercel.app,https://www.ellacvwriter.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: ella-postgres
          property: connectionString
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: "8000"
      - key: DEEPSEEK_TIMEOUT
        value: "100"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"

databases:
  - name: ella-postgres
    plan: free
    region: oregon